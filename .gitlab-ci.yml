# check → test → image → release. Релиз запускается руками, откат — отдельной ручной джобой.
stages: [check, test, image, release]

variables:
  UV_CACHE_DIR: $CI_PROJECT_DIR/.uv-cache
  IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

default:
  interruptible: true

.python:
  image: ghcr.io/astral-sh/uv:0.11.32-python3.13-trixie-slim
  cache:
    key: { files: [uv.lock] }
    paths: [.uv-cache]
  before_script: [uv sync --frozen]

.pg: &pg { name: postgres:16-alpine, alias: db }

lint:
  extends: .python
  stage: check
  script:
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run mypy src tests

schema:
  extends: .python
  stage: check
  services: [*pg]
  variables:
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: vas
    VAS_DB_URL: postgresql+asyncpg://postgres:postgres@db:5432/vas
  script:
    - test "$(uv run alembic heads | wc -l)" = 1   # две головы = две ветки с миграциями
    - uv run alembic upgrade head
    - uv run alembic check                          # модели и миграции не разошлись
    - uv run alembic downgrade base && uv run alembic upgrade head

pytest:
  extends: .python
  stage: test
  services: [*pg, { name: redis:7-alpine, alias: redis }]
  variables:
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: vas_test
    VAS_TEST_DB_URL: postgresql+asyncpg://postgres:postgres@db:5432/vas_test
    VAS_TEST_REDIS_URL: redis://redis:6379/15
  script:
    - uv run pytest --cov --cov-report=term --cov-report=xml --junitxml=report.xml
  coverage: '/TOTAL.*\s(\d+)%/'
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report: { coverage_format: cobertura, path: coverage.xml }

image:
  stage: image
  image: docker:27
  services: [docker:27-dind]
  rules: [{ if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH }]
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build --build-arg BUILD_SHA=$CI_COMMIT_SHORT_SHA -t $IMAGE .
    - docker push $IMAGE

.ssh:
  stage: release
  image: alpine:3.20
  rules: [{ if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH, when: manual }]
  interruptible: false
  resource_group: production   # два релиза одновременно не поедут
  environment: { name: production }
  before_script:
    - apk add --no-cache openssh-client
    - eval "$(ssh-agent -s)" && echo "$DEPLOY_KEY" | ssh-add -
    - mkdir -p ~/.ssh && echo "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

release:
  extends: .ssh
  script:
    - ssh "$DEPLOY_HOST" "cd /srv/vas && ./release.sh $CI_COMMIT_SHORT_SHA"

rollback:
  extends: .ssh
  script:
    # Откатываемся на образ, который был до текущего. Миграции назад не катим:
    # они пишутся совместимыми со старым кодом (expand → migrate → contract).
    - ssh "$DEPLOY_HOST" "cd /srv/vas && ./release.sh \$(cat previous_sha)"
